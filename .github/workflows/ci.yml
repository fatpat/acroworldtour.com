# check runs `make check` on every push and pull request. On a push to the
# deploy branch, once check is green, build pushes the image to GHCR as
# `:<sha>` and as the moving tag `:rewrite-go` (the branch name). CI does not
# deploy and needs no secret beyond the run's GITHUB_TOKEN: the agent on the
# VPS (deploy/agent.sh, systemd timer) polls the moving tag and deploys
# training then prod. See docs/ops.md and docs/decisions/0016-pull-deploy.md.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-1.57.0-${{ hashFiles('scripts/install-playwright.sh') }}
      - run: make e2e-deps
      - run: make check

  build:
    needs: check
    # Publish only pushes to the deploy branch (not pull requests, not other
    # branches). The moving tag below is named after this branch; change both
    # (and AWT_CHANNEL on the VPS) to deploy from another branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite-go'
    # One publish at a time per branch, never cancelled, so an older run can
    # not move the tag after a newer one (with the head check below).
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/awt" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "channel=rewrite-go" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The VPS agent deploys whatever the moving tag points to: move it only
      # if this commit is still the head of the branch, so a slow older run
      # never sends the tag (and prod) backwards. The :<sha> image stays.
      - name: Move the moving tag
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA: ${{ github.sha }}
          CHANNEL: ${{ steps.vars.outputs.channel }}
        run: |
          head=$(git ls-remote origin "refs/heads/${CHANNEL}" | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "::warning::${CHANNEL} is now at ${head:-unknown}, not ${SHA}: pushed :${SHA} only, :${CHANNEL} not moved"
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE}:${CHANNEL}" "${IMAGE}:${SHA}"
