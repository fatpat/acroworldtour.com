# Litestream 0.3.x configuration. Values come from the AWT_* environment
# (litestream expands ${VAR}); deploy/entrypoint.sh exports the defaults and
# LITESTREAM_REPLICA_PATH (<AWT_BUCKET_PREFIX>litestream, from
# `awt bucket-path litestream`; decision 0017).
dbs:
  - path: ${AWT_DB_PATH}
    replicas:
      - type: s3
        bucket: ${AWT_S3_BUCKET}
        path: ${LITESTREAM_REPLICA_PATH}
        endpoint: ${AWT_S3_ENDPOINT}
        region: ${LITESTREAM_S3_REGION}
        access-key-id: ${AWT_S3_ACCESS_KEY}
        secret-access-key: ${AWT_S3_SECRET_KEY}
        force-path-style: true
        retention: 720h
        snapshot-interval: 6h
